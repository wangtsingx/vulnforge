source:
  allowed_extensions: [".c", ".h", ".cc", ".cpp", ".hpp"]
  max_read_lines: 300
  max_search_results: 100
  max_file_bytes: 2000000

static:
  semgrep_binary: semgrep
  rules_file: rules/c-memory.yml
  timeout_seconds: 300
  max_output_bytes: 5000000

patch:
  max_commits: 200
  max_diff_bytes: 1000000
  timeout_seconds: 60

report:
  findings_dir: findings
  reports_dir: reports
  max_findings: 1000

codeql:
  binary: codeql
  language: cpp
  databases_dir: databases
  create_timeout_seconds: 1800
  analyze_timeout_seconds: 3600
  max_output_bytes: 5000000
  allowed_query_suites:
    - cpp-security-extended
    - cpp-code-scanning
    - security-extended

knowledge:
  http_timeout_seconds: 30
  git_timeout_seconds: 60
  max_response_bytes: 500000

fuzzing:
  binary: bash
  max_duration_seconds: 86400
  max_memory_mb: 2048
  max_cpu_seconds: 3600
  max_file_mb: 512
  max_processes: 64

tasks:
  tasks_dir: tasks

coverage:
  ledger_dir: coverage
